wifi_battery_self_use:
  alias: WiFi Battery - Autoconsumo
  description: Modo autoconsumo (self_use) con reserva SOC
  icon: mdi:home-lightning-bolt
  mode: single
  sequence:
  - action: hoymiles_wifi.set_bms_mode
    data:
      bms_mode: self_use
      rev_soc: '{{ states(''input_number.wifi_autoconsumo_reserve_soc'') | int }}'
    target:
      device_id: 859a45ed127fb43057f06cf99e065f8c
wifi_battery_economic:
  alias: WiFi Battery - Economic
  description: Modo economico con horarios y reserva SOC
  icon: mdi:cash-multiple
  mode: single
  sequence:
  - action: hoymiles_wifi.set_bms_mode
    data:
      bms_mode: economic
      rev_soc: '{{ states(''input_number.wifi_autoconsumo_reserve_soc'') | int }}'
      time_settings: '{% set cs = states(''input_datetime.wifi_tou_charge_start'')[-8:-3] %}{% set ce = states(''input_datetime.wifi_tou_charge_end'')[-8:-3] %}{% set cp = states(''input_number.wifi_tou_charge_power'') | int %}{% set csoc = states(''input_number.wifi_tou_charge_soc'') | int %}{% set ds = states(''input_datetime.wifi_tou_discharge_start'')[-8:-3] %}{% set de = states(''input_datetime.wifi_tou_discharge_end'')[-8:-3] %}{% set dp = states(''input_number.wifi_tou_discharge_power'') | int %}{% set dsoc = states(''input_number.wifi_tou_discharge_soc'') | int %}01.01-31.12:1,2,3,4,5,6,7={{ cs }}-{{ ce }}-{{ cp }}-{{ csoc }},{{ ds }}-{{ de }}-{{ dp }}-{{ dsoc }}'
    target:
      device_id: 859a45ed127fb43057f06cf99e065f8c
