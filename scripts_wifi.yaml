wifi_battery_tou:
  alias: WiFi Battery - Time of Use
  description: Horarios de carga/descarga con 2 periodos
  icon: mdi:calendar-clock
  mode: single
  sequence:
  - action: hoymiles_wifi.set_bms_mode
    data:
      bms_mode: time_of_use
      rev_soc: '{{ states(''input_number.wifi_tou_reserve_soc'') | int }}'
      time_periods: '{% set cs = states(''input_datetime.wifi_tou_charge_start'')[-8:-3] %}{% set ce = states(''input_datetime.wifi_tou_charge_end'')[-8:-3] %}{% set cp = states(''input_number.wifi_tou_charge_power'') | int %}{% set csoc = states(''input_number.wifi_tou_charge_soc'') | int %}{% set ds = states(''input_datetime.wifi_tou_discharge_start'')[-8:-3] %}{% set de = states(''input_datetime.wifi_tou_discharge_end'')[-8:-3] %}{% set dp = states(''input_number.wifi_tou_discharge_power'') | int %}{% set dsoc = states(''input_number.wifi_tou_discharge_soc'') | int %}{% set c2s = states(''input_datetime.wifi_tou_charge2_start'')[-8:-3] %}{% set c2e = states(''input_datetime.wifi_tou_charge2_end'')[-8:-3] %}{% set c2p = states(''input_number.wifi_tou_charge2_power'') | int %}{% set c2soc = states(''input_number.wifi_tou_charge2_soc'') | int %}{% set d2s = states(''input_datetime.wifi_tou_discharge2_start'')[-8:-3] %}{% set d2e = states(''input_datetime.wifi_tou_discharge2_end'')[-8:-3] %}{% set d2p = states(''input_number.wifi_tou_discharge2_power'') | int %}{% set d2soc = states(''input_number.wifi_tou_discharge2_soc'') | int %}{{ cs }}-{{ ce }}-{{ cp }}-{{ csoc }}|{{ ds }}-{{ de }}-{{ dp }}-{{ dsoc }}||{{ c2s }}-{{ c2e }}-{{ c2p }}-{{ c2soc }}|{{ d2s }}-{{ d2e }}-{{ d2p }}-{{ d2soc }}'
    target:
      device_id: 859a45ed127fb43057f06cf99e065f8c
